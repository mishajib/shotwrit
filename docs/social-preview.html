<!doctype html>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    font-family: "Ubuntu Sans", "Ubuntu", sans-serif;
    color: #fff;
    background:
      radial-gradient(700px 500px at 88% 8%, rgba(233,84,32,.28), transparent 70%),
      radial-gradient(600px 400px at 0% 100%, rgba(233,84,32,.10), transparent 70%),
      #1b1b1d;
    position: relative;
  }
  .grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: linear-gradient(90deg, transparent 0, #000 60%);
  }
  .left { position: absolute; left: 80px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 18px; margin-bottom: 34px; }
  .logo {
    width: 64px; height: 64px; border-radius: 16px; background: #e95420;
    display: grid; place-items: center; box-shadow: 0 8px 24px rgba(233,84,32,.4);
  }
  .brand b { font-size: 30px; font-weight: 600; letter-spacing: .2px; }
  h1 { font-size: 76px; line-height: 1.02; font-weight: 700; letter-spacing: -2px; }
  h1 span { color: #e95420; }
  p { margin-top: 26px; font-size: 27px; line-height: 1.38; color: #b9b9c0; max-width: 500px; }
  .tags { display: flex; gap: 10px; margin-top: 36px; }
  .tags i {
    font-style: normal; font-size: 19px; font-weight: 500; padding: 8px 16px; border-radius: 999px;
    border: 1.5px solid rgba(255,255,255,.18); color: #e4e4e8; background: rgba(255,255,255,.04);
  }
  .tags i.hot { border-color: #e95420; color: #ff9b78; }
  .shot {
    position: absolute; left: 690px; top: 150px; width: 700px; border-radius: 14px; overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1.5px rgba(255,255,255,.12);
    transform: rotate(-2deg); transform-origin: left top;
  }
  .shot img { display: block; width: 700px; }
  .key {
    position: absolute; left: 690px; top: 62px; background: #2b2b2f; border: 1.5px solid rgba(255,255,255,.2);
    border-radius: 12px; padding: 10px 18px; font-size: 22px; font-weight: 600; color: #fff;
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
  }
  .key em { font-style: normal; color: #e95420; }
</style>
<div class="grid"></div>
<div class="left">
  <div class="brand">
    <div class="logo">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/>
        <path d="M9 15l5.5-5.5 1.5 1.5L10.5 16.5 8.5 17z"/>
      </svg>
    </div>
    <b>Shotwrit</b>
  </div>
  <h1>Capture.<br><span>Mark up.</span><br>Share.</h1>
  <p>A lightweight screenshot tool for GNOME with built-in markup.</p>
  <div class="tags"><i class="hot">GNOME</i><i>Wayland</i><i>GTK 4</i></div>
</div>
<div class="key"><em>Ctrl + Alt + S</em> &nbsp;quick capture</div>
<div class="shot"><img src="demo.png"></div>
